<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urna da Live</title>
<style>
  /* 1 unidade = 1% da largura de uma tela em pé (9:16) que cabe na janela */
  :root { --u:min(1vw, 0.5625vh); --vermelho:#d62828; --verde:#1f9d55; --fundo:#5b5e63; --card:#11141a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:100%; height:100%; background:transparent; overflow:hidden;
    font-family:Impact, 'Arial Black', sans-serif; color:#fff; }
  html.fundo body { background:radial-gradient(circle at 50% 30%, #8a8d92, var(--fundo)); }
  .tela { width:calc(100 * var(--u)); height:calc(177.78 * var(--u)); margin:0 auto;
    padding:calc(2 * var(--u)) calc(3 * var(--u)) 0; display:flex; flex-direction:column; gap:calc(2 * var(--u)); }
  .rosa { width:1.1em; height:1.4em; vertical-align:-.35em; }

  /* tempo e rodada */
  .tempo { align-self:center; width:calc(48 * var(--u)); background:#15181d; border-radius:calc(3 * var(--u));
    padding:calc(1.4 * var(--u)) calc(3 * var(--u)) calc(2 * var(--u)); box-shadow:0 calc(.8 * var(--u)) 0 #000;
    text-align:center; }
  .tempo .t { font-size:calc(3.4 * var(--u)); letter-spacing:calc(.8 * var(--u)); color:#d9dde3; }
  .tempo .t span { color:#ffd166; }
  .tempo .trilho { margin-top:calc(1 * var(--u)); height:calc(2.6 * var(--u)); border-radius:calc(2 * var(--u));
    background:#2a2e35; overflow:hidden; }
  .tempo .trilho div { height:100%; width:100%; background:linear-gradient(#fff,#cfd3d8); border-radius:inherit;
    transition:width 1s linear; }
  .tempo.acabando .trilho div { background:linear-gradient(#ff8a80,#e53935); }
  .sem-tempo .tempo { display:none; }

  .faixa { background:#1c1f25; border:calc(.5 * var(--u)) solid #000; border-radius:calc(5 * var(--u));
    text-align:center; font-size:calc(5 * var(--u)); color:#ffd166; padding:calc(.8 * var(--u));
    text-shadow:0 calc(.4 * var(--u)) 0 #000; box-shadow:inset 0 0 0 calc(.4 * var(--u)) #3a3f48; }
  .faixa.fim { background:#ffd166; color:#111; text-shadow:none; font-size:calc(4.4 * var(--u)); white-space:nowrap; animation:pisca .5s 6 alternate; }
  @keyframes pisca { to { transform:scale(1.04); } }

  /* placares */
  .lados { display:grid; grid-template-columns:1fr 1fr; gap:calc(3 * var(--u)); }
  .lado { display:flex; flex-direction:column; gap:calc(1.6 * var(--u)); }
  .placar { position:relative; border-radius:calc(3 * var(--u)); padding:calc(.9 * var(--u));
    box-shadow:0 calc(.8 * var(--u)) 0 rgba(0,0,0,.5); }
  .g .placar { background:linear-gradient(#2fb866,#167a3f); }
  .r .placar { background:linear-gradient(#ef4444,#a51d1d); }
  .placar .miolo { background:var(--card); border-radius:calc(2.2 * var(--u)); margin-top:calc(5 * var(--u));
    padding:calc(1 * var(--u)) calc(2.5 * var(--u)) calc(2 * var(--u)); text-align:center; }
  .frente { position:absolute; top:calc(1.2 * var(--u)); left:50%; transform:translateX(-50%); white-space:nowrap;
    background:#ffd84d; color:#4a3500; border-radius:calc(3 * var(--u)); padding:calc(.3 * var(--u)) calc(2.4 * var(--u));
    font-size:calc(2.6 * var(--u)); visibility:hidden; }
  .lidera .frente { visibility:visible; }
  .pontos { font-size:calc(13 * var(--u)); line-height:1; text-shadow:0 calc(.5 * var(--u)) 0 #000; }
  .pontos.pulo { animation:pulo .4s; }
  @keyframes pulo { 50% { transform:scale(1.15); } }
  .rotulo { font-size:calc(2.6 * var(--u)); letter-spacing:calc(1 * var(--u)); color:#c9a96e; margin:calc(.4 * var(--u)) 0 calc(1.4 * var(--u)); }
  .progresso { height:calc(2.4 * var(--u)); border-radius:calc(2 * var(--u)); background:#2a2e35; overflow:hidden; }
  .progresso div { height:100%; width:0; border-radius:inherit; transition:width .6s; }
  .g .progresso div { background:linear-gradient(#4ade80,#16a34a); }
  .r .progresso div { background:linear-gradient(#f87171,#dc2626); }
  .ultimo { margin-top:calc(1 * var(--u)); background:#15181d; border-radius:calc(2 * var(--u));
    font-size:calc(2.7 * var(--u)); padding:calc(.8 * var(--u)) calc(2 * var(--u)); white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; text-align:center; }

  /* urna */
  .urna { background:linear-gradient(#f1eee8,#c3bdb1); border-radius:calc(2.5 * var(--u)); padding:calc(2 * var(--u));
    display:grid; grid-template-columns:1.25fr 1fr; gap:calc(2 * var(--u)); box-shadow:0 calc(1.2 * var(--u)) 0 #7a756b; }
  .visor { position:relative; border-radius:calc(.8 * var(--u)); height:calc(22 * var(--u)); overflow:hidden;
    border:calc(1 * var(--u)) solid; display:flex; align-items:center; justify-content:center; background:#e8eef2; }
  .g .visor { border-color:#1f9d55; } .r .visor { border-color:#d62828; }
  .visor img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .visor .sem-foto { font-size:calc(11 * var(--u)); color:#333; }
  .visor .digitos { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(232,238,242,.94); color:#111; font-family:'Courier New', monospace; font-weight:bold; }
  .visor.digitando .digitos { display:flex; }
  .digitos .num { font-size:calc(9 * var(--u)); letter-spacing:calc(1.5 * var(--u)); }
  .digitos .cand { font-size:calc(2.6 * var(--u)); }
  .teclado { background:#1d1f22; border-radius:calc(1.2 * var(--u)); padding:calc(1.2 * var(--u));
    display:grid; grid-template-columns:repeat(3,1fr); gap:calc(.7 * var(--u)); align-content:center; }
  .tecla { background:#0d0e10; color:#fff; border-radius:calc(.6 * var(--u)); text-align:center;
    font:bold calc(2.4 * var(--u)) Arial, sans-serif; padding:calc(.4 * var(--u)) 0; transition:background .1s; }
  .tecla.z { grid-column:2; }
  .tecla.ap { background:#9aa0a6; }
  .botoes { grid-column:1 / 4; display:grid; grid-template-columns:1fr 1fr 1fr; gap:calc(.5 * var(--u)); margin-top:calc(.5 * var(--u)); }
  .botoes div { border-radius:calc(.4 * var(--u)); font:bold calc(1.05 * var(--u)) Arial, sans-serif; overflow:hidden; text-align:center;
    padding:calc(.5 * var(--u)) 0; color:#111; }
  .b-branco { background:#f5f5f5; } .b-corrige { background:#f08a24; } .b-confirma { background:#27a844; }
  .b-confirma.ap { background:#9ef0b4; }

  /* espaço do debate: fica transparente para o vídeo aparecer por baixo */
  .debate { flex:1; position:relative; margin:0 calc(-3 * var(--u)); }
  .debate iframe, .debate video { position:absolute; inset:0; width:100%; height:100%; border:0; object-fit:contain; }

  /* parte de baixo (quando não tem vídeo): como votar + ranking */
  .extras { position:absolute; left:calc(3 * var(--u)); right:calc(3 * var(--u)); bottom:calc(1.5 * var(--u));
    display:flex; flex-direction:column; gap:calc(1.6 * var(--u)); }
  .com-video .extras { display:none; }
  .caixa { background:rgba(17,20,26,.88); border-radius:calc(2.5 * var(--u)); padding:calc(1.6 * var(--u)) calc(2.5 * var(--u)); }
  .caixa h3 { font-weight:normal; font-size:calc(3.2 * var(--u)); color:#ffd166; letter-spacing:calc(.5 * var(--u));
    text-align:center; margin-bottom:calc(1 * var(--u)); }
  .como { display:grid; grid-template-columns:1fr 1fr; gap:calc(2 * var(--u)); font-size:calc(3.4 * var(--u)); text-align:center; white-space:nowrap; }
  .como div { border-radius:calc(2 * var(--u)); padding:calc(1 * var(--u)); }
  .como .c22 { background:rgba(31,157,85,.25); border:calc(.4 * var(--u)) solid var(--verde); }
  .como .c13 { background:rgba(214,40,40,.25); border:calc(.4 * var(--u)) solid var(--vermelho); }
  .como .rosa { width:1.4em; height:1.8em; vertical-align:-.55em; }
  .ranking { display:grid; grid-template-columns:1fr 1fr; gap:calc(3 * var(--u)); font-family:Arial, sans-serif; }
  .ranking .linha { display:flex; align-items:center; gap:calc(1.2 * var(--u)); font-size:calc(2.8 * var(--u));
    padding:calc(.5 * var(--u)) 0; min-height:calc(6 * var(--u)); }
  .ranking .pos { font-family:Impact, sans-serif; font-size:calc(3.4 * var(--u)); width:calc(4 * var(--u)); text-align:center; }
  .ranking img, .ranking .sem { width:calc(5 * var(--u)); height:calc(5 * var(--u)); border-radius:50%; object-fit:cover;
    background:#444; flex:none; }
  .ranking .nm { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ranking .qt { font-weight:bold; }
  .ranking .vazio { color:#888; font-size:calc(2.6 * var(--u)); text-align:center; padding:calc(1.5 * var(--u)) 0; }
  .ranking .g h4 { color:#4ade80; } .ranking .r h4 { color:#f87171; }
  .ranking h4 { font:normal calc(2.8 * var(--u)) Impact, sans-serif; text-align:center; margin-bottom:calc(.4 * var(--u)); }

  /* sua marca: em cima e no rodapé */
  .marca { position:absolute; top:calc(3 * var(--u)); left:calc(3 * var(--u)); font-size:calc(3 * var(--u));
    line-height:1.05; color:#ffd166; text-shadow:0 calc(.4 * var(--u)) 0 #000; max-width:calc(22 * var(--u)); }
  .marca small { display:block; font:bold calc(1.6 * var(--u)) Arial, sans-serif; color:#fff; letter-spacing:calc(.2 * var(--u)); }
  .rodape { margin:0 calc(-3 * var(--u)); background:linear-gradient(90deg,#ffb703,#ffd166,#ffb703); color:#1a1300;
    text-align:center; font-size:calc(3.4 * var(--u)); padding:calc(1.3 * var(--u)) calc(2 * var(--u));
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rodape b { font-weight:normal; color:#7a0000; }
  .rodape:empty, .marca:empty { display:none; }

  /* quem votou */
  .avisos { position:absolute; top:calc(2 * var(--u)); left:calc(3 * var(--u)); width:70%; display:flex;
    flex-direction:column; gap:calc(1.2 * var(--u)); z-index:2; }
  .aviso { width:100%; display:flex; align-items:center; gap:calc(2 * var(--u)); background:rgba(0,0,0,.6);
    border-radius:calc(10 * var(--u)); padding:calc(1 * var(--u)) calc(3 * var(--u)) calc(1 * var(--u)) calc(1 * var(--u));
    font-family:Arial, sans-serif; animation:entra 4s forwards; }
  .aviso img.foto, .aviso .sem { width:calc(7 * var(--u)); height:calc(7 * var(--u)); border-radius:50%;
    object-fit:cover; background:#555; flex:none; }
  .aviso b { font-size:calc(3.4 * var(--u)); display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .aviso span { font-size:calc(2.7 * var(--u)); color:#ddd; }
  .aviso .presente { font-size:calc(6 * var(--u)); margin-left:auto; line-height:0; }
  .aviso .x { font-family:Impact, sans-serif; font-style:italic; font-size:calc(6 * var(--u)); text-shadow:0 calc(.4 * var(--u)) 0 #000; }
  @keyframes entra { 0% { opacity:0; transform:translateX(calc(-10 * var(--u))) } 8%,85% { opacity:1; transform:none }
    100% { opacity:0 } }
</style>
</head>
<body>
<div class="tela" style="position:relative">
  <div class="marca" id="marca"></div>
  <div class="tempo" id="tempo">
    <div class="t">TEMPO <span id="relogio">--:--</span></div>
    <div class="trilho"><div id="barraTempo"></div></div>
  </div>
  <div class="faixa" id="faixa">RODADA ABERTA</div>

  <div class="lados">
    <div class="lado g" id="lado22">
      <div class="placar">
        <div class="frente">👑 NA FRENTE</div>
        <div class="miolo">
          <div class="pontos" id="pontos22">0</div>
          <div class="rotulo">PONTOS</div>
          <div class="progresso"><div id="prog22"></div></div>
        </div>
        <div class="ultimo" id="ultimo22"></div>
      </div>
      <div class="urna"><div class="visor" id="visor22"></div><div class="teclado" id="teclado22"></div></div>
    </div>
    <div class="lado r" id="lado13">
      <div class="placar">
        <div class="frente">👑 NA FRENTE</div>
        <div class="miolo">
          <div class="pontos" id="pontos13">0</div>
          <div class="rotulo">PONTOS</div>
          <div class="progresso"><div id="prog13"></div></div>
        </div>
        <div class="ultimo" id="ultimo13"></div>
      </div>
      <div class="urna"><div class="visor" id="visor13"></div><div class="teclado" id="teclado13"></div></div>
    </div>
  </div>

  <div class="debate" id="debate">
    <div class="avisos" id="avisos"></div>
    <div class="extras">
      <div class="caixa">
        <h3>COMO VOTAR</h3>
        <div class="como">
          <div class="c22"><span class="ico" data-cor="22"></span> Rosa branca = <span>22</span></div>
          <div class="c13"><span class="ico" data-cor="13"></span> Rosa = <span>13</span></div>
        </div>
      </div>
      <div class="caixa">
        <h3>🏆 TOP APOIADORES</h3>
        <div class="ranking">
          <div class="g"><h4 id="rk22t">22</h4><div id="rk22"></div></div>
          <div class="r"><h4 id="rk13t">13</h4><div id="rk13"></div></div>
        </div>
      </div>
    </div>
  </div>
  <div class="rodape" id="rodape"></div>
</div>

<script>
// Abra com ?fundo=1 para ver com fundo (sem isso o fundo é transparente para a live).
const params = new URLSearchParams(location.search);
if (params.has('fundo')) document.documentElement.classList.add('fundo');

const nomes = { '13': 'Lula 13', '22': 'Flávio 22' };
const nomePresente = { '13': 'Rosa', '22': 'Rosa branca' };
const $ = id => document.getElementById(id);
const esperar = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

// Rosa desenhada: vermelha para o 13 e branca para o 22 (igual aos presentes do TikTok).
const CORES_ROSA = { '13': ['#e0182d', '#b30f22', '#7d0814'], '22': ['#fbfaf5', '#e4e0d3', '#b9b3a0'] };
function rosa(n) {
  const [p1, p2, sombra] = CORES_ROSA[n];
  return `<svg class="rosa" viewBox="0 0 32 40"><path d="M16 23V39" stroke="#2d8a3e" stroke-width="2.4"/>
    <path d="M16 31C11 27 8 29 6.5 32.5C11 34 14 33 16 31Z" fill="#3aa14c"/>
    <path d="M16 34C21 30 24 31 25.5 34.5C21 36 18 36 16 34Z" fill="#3aa14c"/>
    <path d="M5 10C5 20 10.5 25 16 25S27 20 27 10C23 13 19.5 9.5 16 6C12.5 9.5 9 13 5 10Z" fill="${p1}" stroke="${sombra}" stroke-width=".6"/>
    <path d="M9.5 9.5C10.5 4 13.5 1.5 16 1.5S21.5 4 22.5 9.5C19.5 11.5 17.5 9 16 7.5C14.5 9 12.5 11.5 9.5 9.5Z" fill="${p2}" stroke="${sombra}" stroke-width=".6"/>
    <path d="M5.5 11C7 19 11 22 15 22.5C11 19 9.5 15 10.5 10.5M26.5 11C25 19 21 22 17 22.5C21 19 22.5 15 21.5 10.5" fill="${p2}" stroke="${sombra}" stroke-width=".6"/>
    <path d="M16 16.5c-2.2 0-3.2-1.8-2.2-3.3s3.8-1.2 3.8 1-2.2 3.4-4.4 2.6" stroke="${sombra}" stroke-width="1" fill="none"/></svg>`;
}

document.querySelectorAll('.ico').forEach(el => el.innerHTML = rosa(el.dataset.cor));

function ranking(n, lista) {
  const medalhas = ['🥇', '🥈', '🥉'];
  $('rk' + n).innerHTML = lista.length
    ? lista.map((e, i) => `<div class="linha"><span class="pos">${medalhas[i]}</span>`
        + (e.foto ? `<img src="${esc(e.foto)}">` : '<span class="sem"></span>')
        + `<span class="nm">${esc(e.nome)}</span><span class="qt">${e.qtd}</span></div>`).join('')
    : '<div class="vazio">Mande a primeira rosa!</div>';
}

// Urnas: teclado + foto do candidato no visor (public/fotos/13.jpg e 22.jpg).
for (const n of ['13', '22']) {
  $('teclado' + n).innerHTML = [1,2,3,4,5,6,7,8,9].map(d => `<div class="tecla" data-d="${d}">${d}</div>`).join('')
    + '<div class="tecla z" data-d="0">0</div>'
    + '<div class="botoes"><div class="b-branco">BRANCO</div><div class="b-corrige">CORRIGE</div><div class="b-confirma">CONFIRMA</div></div>';
  $('visor' + n).innerHTML = `<div class="sem-foto">${n}</div>`
    + '<div class="digitos"><div class="num">_ _</div><div class="cand"></div></div>';
  carregarFoto(n, ['jpg', 'png', 'jpeg', 'webp']);
}
function carregarFoto(n, extensoes) {
  if (!extensoes.length) return;
  const img = new Image();
  img.onload = () => $('visor' + n).prepend(img);
  img.onerror = () => carregarFoto(n, extensoes.slice(1));
  img.src = `/fotos/${n}.${extensoes[0]}`;
}

// Vídeo do debate dentro da própria tela (opcional, no config.json).
let videoAtual = '';
function mostrarVideo(link) {
  if (!link || link === videoAtual) return;
  videoAtual = link;
  const id = (link.match(/(?:v=|youtu\.be\/|live\/|embed\/)([\w-]{11})/) || [])[1];
  let f;
  if (id) {
    f = document.createElement('iframe');
    f.src = `https://www.youtube.com/embed/${id}?autoplay=1&controls=0&rel=0&loop=1&playlist=${id}`;
    f.allow = 'autoplay; encrypted-media';
  } else {
    // Arquivo de vídeo colocado na pasta "public" (ex.: debate.mp4), repete sem parar.
    f = document.createElement('video');
    f.src = '/' + encodeURIComponent(link);
    f.autoplay = f.loop = f.playsInline = true;
  }
  $('debate').prepend(f);
  $('debate').classList.add('com-video');
}

// Bipe da urna.
let audio, volume = 30; // 0 = mudo, 100 = máximo (vem do config.json ou de ?volume=)
function bipe(freq, dur) {
  if (volume <= 0) return;
  try {
    audio = audio || new AudioContext();
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = freq; o.type = 'sine'; g.gain.value = 0.25 * volume / 100;
    o.connect(g).connect(audio.destination);
    o.start(); o.stop(audio.currentTime + dur);
  } catch {}
}

async function apertar(n, seletor) {
  const t = $('teclado' + n).querySelector(seletor);
  t.classList.add('ap'); await esperar(180); t.classList.remove('ap');
}

// Cada urna digita uma vez por rodada de animação. Votos que chegam enquanto ela está
// digitando não viram fila: só garantem mais UMA rodada depois (senão apita sem parar).
const pendente = { '13': false, '22': false }, ocupada = { '13': false, '22': false };

async function digitar(n) {
  pendente[n] = true;
  if (ocupada[n]) return;
  ocupada[n] = true;
  const visor = $('visor' + n), num = visor.querySelector('.num'), cand = visor.querySelector('.cand');
  while (pendente[n]) {
    pendente[n] = false;
    visor.classList.add('digitando');
    num.textContent = '_ _'; cand.textContent = '';
    await apertar(n, `[data-d="${n[0]}"]`);
    num.textContent = `${n[0]} _`;
    await apertar(n, `[data-d="${n[1]}"]`);
    num.textContent = n; cand.textContent = nomes[n];
    await esperar(300);
    await apertar(n, '.b-confirma');
    bipe(1200, .15);
    visor.classList.remove('digitando'); // volta a mostrar a foto
    await esperar(1500);
  }
  ocupada[n] = false;
}

// No máximo 3 avisos na tela. Se a mesma pessoa manda de novo, o aviso dela
// só aumenta o "x" em vez de criar outro.
const MAX_AVISOS = 2;
function mostrarEleitor(m) {
  const caixa = $('avisos');
  const id = `${m.numero}:${m.nome}`;
  let el = [...caixa.children].find(a => a.dataset.id === id);
  if (el) {
    el.dataset.qtd = Number(el.dataset.qtd) + m.qtd;
    el.querySelector('.x').textContent = 'x' + el.dataset.qtd;
    clearTimeout(el.timer);
    el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
  } else {
    el = document.createElement('div');
    el.className = 'aviso';
    el.dataset.id = id;
    el.dataset.qtd = m.qtd;
    el.innerHTML = (m.foto ? `<img class="foto" src="${esc(m.foto)}">` : '<div class="sem"></div>')
      + `<div style="min-width:0"><b>${esc(m.nome)}</b><span>enviou ${nomePresente[m.numero]}</span></div>`
      + `<div class="presente">${rosa(m.numero)}</div><div class="x">x${m.qtd}</div>`;
    while (caixa.children.length >= MAX_AVISOS) caixa.lastElementChild.remove();
  }
  caixa.prepend(el);
  el.timer = setTimeout(() => el.remove(), 4000);
}

// Tempo da rodada (vem do servidor; corrige diferença de relógio entre PC e página).
let fimRodada = 0, duracao = 0, diferenca = 0, mostrandoResultado = false;
function tique() {
  if (!fimRodada) { document.body.classList.add('sem-tempo'); return; }
  document.body.classList.remove('sem-tempo');
  const resta = Math.max(0, fimRodada - (Date.now() + diferenca));
  const s = Math.ceil(resta / 1000);
  $('relogio').textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  $('barraTempo').style.width = (duracao ? resta / duracao * 100 : 0) + '%';
  $('tempo').classList.toggle('acabando', s <= 30);
}
setInterval(tique, 500);

function mostrarResultado(m) {
  mostrandoResultado = true;
  const faixa = $('faixa');
  faixa.classList.add('fim');
  faixa.textContent = m.vencedor
    ? `🏆 ${nomes[m.vencedor].toUpperCase()} VENCEU! ${m.votos['22']} x ${m.votos['13']}`
    : `EMPATE! ${m.votos['22']} x ${m.votos['13']}`;
  bipe(1200, .1); setTimeout(() => bipe(1500, .3), 150);
  setTimeout(() => {
    mostrandoResultado = false;
    faixa.classList.remove('fim');
    faixa.textContent = 'RODADA ABERTA';
  }, 12000);
}

function atualizar(p) {
  Object.assign(nomes, p.nomes);
  mostrarVideo(p.videoDebate);
  volume = Number(params.get('volume') ?? p.volumeBipe ?? 30); // ?volume=10 tem prioridade
  fimRodada = p.fimRodada; duracao = p.duracaoRodada; diferenca = p.agora - Date.now();
  if (!fimRodada && !mostrandoResultado) $('faixa').textContent = 'VOTAÇÃO ABERTA';
  tique();

  $('marca').innerHTML = p.marca ? `${esc(p.marca)}<small>JOGOS INTERATIVOS</small>` : '';
  $('rodape').innerHTML = p.contato
    ? `🎮 Jogo interativo pra sua live? <b>WhatsApp ${esc(p.contato)}</b>` : '';

  const total = p.votos['13'] + p.votos['22'];
  for (const n of ['13', '22']) {
    const el = $('pontos' + n);
    if (el.textContent !== String(p.votos[n])) { el.classList.remove('pulo'); void el.offsetWidth; el.classList.add('pulo'); }
    el.textContent = p.votos[n];
    $('prog' + n).style.width = (total ? p.votos[n] / total * 100 : 0) + '%';
    const outro = n === '13' ? '22' : '13';
    $('lado' + n).classList.toggle('lidera', p.votos[n] > p.votos[outro]);
    $('rk' + n + 't').textContent = nomes[n];
    ranking(n, p.top[n]);
    const ult = p.ultimo?.[n];
    $('ultimo' + n).innerHTML = ult ? `@${esc(ult)} • ${nomePresente[n]} ${rosa(n)}` : `${nomePresente[n]} ${rosa(n)} = ${esc(nomes[n])}`;
  }
}

function conectar() {
  const ws = new WebSocket(`ws://${location.host}`);
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.tipo === 'placar') atualizar(m);
    if (m.tipo === 'fimRodada') mostrarResultado(m);
    if (m.tipo === 'voto') {
      mostrarEleitor(m);
      digitar(m.numero);
    }
  };
  ws.onclose = () => setTimeout(conectar, 2000);
}
conectar();
</script>
</body>
</html>
