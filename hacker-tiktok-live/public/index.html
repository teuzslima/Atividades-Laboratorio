<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rastreador da Live</title>
<link rel="stylesheet" href="/leaflet/leaflet.css">
<style>
  /* 1 unidade = 1% da largura de uma tela em pé (9:16) que cabe na janela */
  :root { --u:min(1vw, 0.5625vh); --verde:#39ff6a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; color:#fff; font-family:Arial, sans-serif; }
  .tela { position:relative; width:calc(100 * var(--u)); height:calc(177.78 * var(--u)); margin:0 auto; overflow:hidden; background:#071018; }
  #mapa { position:absolute; inset:0; background:#071018; z-index:0; } /* z-index: mantém as camadas do mapa embaixo do resto */
  .leaflet-control-attribution { font-size:calc(1.4 * var(--u)) !important; background:rgba(0,0,0,.5) !important; color:#aaa !important; }
  .leaflet-control-attribution a { color:#ccc !important; }

  /* clima "hacker": escurece o mapa, grade e linhas de tela */
  .tinta { position:absolute; inset:0; pointer-events:none; background:rgba(0,20,10,.35); transition:background 1s;
    box-shadow:inset 0 0 calc(20 * var(--u)) rgba(0,0,0,.9); }
  .rastreando .tinta { background:rgba(0,20,10,.1); }
  .linhas { position:absolute; inset:0; pointer-events:none; opacity:.25;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.6) 0 1px, transparent 1px 3px); }

  .mono { font-family:'Courier New', Consolas, monospace; }
  .topo { position:absolute; top:calc(2.5 * var(--u)); left:calc(3 * var(--u)); right:calc(3 * var(--u));
    display:flex; justify-content:space-between; align-items:center; font-size:calc(2.6 * var(--u)); color:var(--verde);
    text-shadow:0 0 calc(1 * var(--u)) var(--verde); }
  .topo b { font-family:Impact, sans-serif; font-weight:normal; font-size:calc(3.6 * var(--u)); color:#ffd166; text-shadow:0 calc(.3 * var(--u)) 0 #000; }
  .ponto { display:inline-block; width:calc(1.6 * var(--u)); height:calc(1.6 * var(--u)); border-radius:50%; background:#ff3b30;
    animation:pisca 1s steps(2) infinite; vertical-align:middle; }
  @keyframes pisca { 50% { opacity:0; } }

  /* terminal */
  .terminal { position:absolute; top:calc(8 * var(--u)); left:calc(3 * var(--u)); width:calc(52 * var(--u)); height:calc(31 * var(--u));
    background:rgba(0,0,0,.78); border:calc(.3 * var(--u)) solid rgba(57,255,106,.6); border-radius:calc(1.5 * var(--u));
    padding:calc(1.2 * var(--u)) calc(1.6 * var(--u)); font-size:calc(2.4 * var(--u)); line-height:1.35; color:var(--verde);
    overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end; text-shadow:0 0 calc(.6 * var(--u)) rgba(57,255,106,.6); }
  .terminal .t { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .terminal .forte { color:#fff; }
  .terminal .alerta { color:#ff3b30; }
  .cursor::after { content:'█'; animation:pisca .8s steps(2) infinite; }

  /* webcam falsa */
  .cam { position:absolute; top:calc(8 * var(--u)); right:calc(3 * var(--u)); width:calc(39 * var(--u)); height:calc(31 * var(--u));
    border:calc(.3 * var(--u)) solid rgba(255,255,255,.35); border-radius:calc(1.5 * var(--u)); overflow:hidden; background:#000; }
  .cam video, .cam svg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .cam video { display:none; }
  .cam.com-video video { display:block; }
  .cam.com-video svg.cena { display:none; }
  .cam .efeito { filter:contrast(1.15) saturate(.55) brightness(.95); }
  .cam canvas { position:absolute; inset:0; width:100%; height:100%; opacity:.18; mix-blend-mode:screen; pointer-events:none; }
  .cam .hud { position:absolute; inset:0; padding:calc(.8 * var(--u)) calc(1.2 * var(--u)); font-size:calc(2 * var(--u));
    color:#fff; text-shadow:0 0 calc(.4 * var(--u)) #000; display:flex; flex-direction:column; justify-content:space-between; pointer-events:none; }
  .cam .hud div { display:flex; justify-content:space-between; }
  .cam .hud::before { content:''; position:absolute; inset:0; background:repeating-linear-gradient(0deg, rgba(0,0,0,.35) 0 1px, transparent 1px 3px); }
  .cabeca { animation:cabeca 4s ease-in-out infinite; transform-origin:100px 120px; }
  .rastreando .cabeca { animation:cabeca 1.4s ease-in-out infinite; }
  @keyframes cabeca { 0%,100% { transform:rotate(-2deg) translateY(0); } 50% { transform:rotate(2.5deg) translateY(2px); } }
  .maos { animation:digita .18s steps(2) infinite; }
  @keyframes digita { 50% { transform:translateY(-2px); } }

  /* mira no centro do mapa */
  .mira { position:absolute; left:50%; top:58%; width:calc(40 * var(--u)); height:calc(40 * var(--u)); transform:translate(-50%, -50%);
    pointer-events:none; opacity:0; transition:opacity .4s; }
  .rastreando .mira { opacity:1; }
  .mira svg { width:100%; height:100%; animation:mira 3s linear infinite; }
  @keyframes mira { to { transform:rotate(360deg); } }
  .alvo-ponto { position:absolute; left:50%; top:58%; width:calc(5 * var(--u)); height:calc(5 * var(--u)); transform:translate(-50%, -50%);
    border-radius:50%; background:#ff3b30; box-shadow:0 0 0 0 rgba(255,59,48,.7); opacity:0; }
  .achou .alvo-ponto { opacity:1; animation:onda 1.2s infinite; }
  @keyframes onda { to { box-shadow:0 0 0 calc(10 * var(--u)) rgba(255,59,48,0); } }

  /* resultado */
  .resultado { position:absolute; left:calc(6 * var(--u)); right:calc(6 * var(--u)); top:calc(117 * var(--u));
    background:rgba(0,0,0,.85); border:calc(.4 * var(--u)) solid #ff3b30; border-radius:calc(2 * var(--u));
    padding:calc(1.6 * var(--u)) calc(2 * var(--u)); text-align:center; display:none; }
  .achou .resultado { display:block; animation:entra .35s; }
  @keyframes entra { 0% { transform:scale(1.3); opacity:0 } 100% { transform:none; opacity:1 } }
  .resultado h2 { font:normal calc(5.4 * var(--u)) Impact, sans-serif; color:#ff3b30; letter-spacing:calc(.4 * var(--u)); }
  .resultado .quem { display:flex; align-items:center; justify-content:center; gap:calc(2 * var(--u)); margin:calc(1 * var(--u)) 0; }
  .resultado img, .resultado .sem { display:inline-block; width:calc(9 * var(--u)); height:calc(9 * var(--u)); border-radius:50%; object-fit:cover;
    border:calc(.4 * var(--u)) solid #ff3b30; background:#333; flex:none; }
  .resultado .nome { font:bold calc(5 * var(--u)) Arial, sans-serif; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .resultado .arroba { font:bold calc(3.4 * var(--u)) Arial, sans-serif; color:#ffe14d; }
  .resultado .cidade { font:normal calc(7 * var(--u)) Impact, sans-serif; color:#fff; }
  .resultado small { display:block; font-size:calc(2.2 * var(--u)); color:#9ca3af; margin-top:calc(.6 * var(--u)); }

  /* scanner da casa: desenho 3D (não é foto de casa real) */
  .scan { position:absolute; left:calc(7 * var(--u)); right:calc(7 * var(--u)); top:calc(44 * var(--u)); height:calc(68 * var(--u));
    background:rgba(0,8,4,.92); border:calc(.4 * var(--u)) solid var(--verde); border-radius:calc(2 * var(--u)); overflow:hidden;
    display:none; box-shadow:0 0 calc(5 * var(--u)) rgba(57,255,106,.35); }
  .escaneando .scan { display:block; animation:entra .35s; }
  .escaneando .mira, .escaneando .alvo-ponto { opacity:0 !important; }
  .scan canvas { position:absolute; inset:0; width:100% !important; height:100% !important; }
  .scan .cab, .scan .pe { position:absolute; left:0; right:0; padding:calc(1 * var(--u)) calc(2 * var(--u)); font-size:calc(2.5 * var(--u));
    color:var(--verde); display:flex; justify-content:space-between; text-shadow:0 0 calc(.5 * var(--u)) var(--verde); }
  .scan .cab { top:0; border-bottom:1px solid rgba(57,255,106,.3); background:rgba(0,0,0,.5); }
  .scan .pe { bottom:0; flex-direction:column; align-items:center; gap:calc(.3 * var(--u)); background:rgba(0,0,0,.55); }
  .scan .status { font-size:calc(3.4 * var(--u)); color:#fff; }
  .scan.achou-casa .status { color:#ff3b30; font-family:Impact, sans-serif; font-size:calc(4.6 * var(--u)); text-shadow:0 0 calc(1 * var(--u)) #ff3b30; }
  .scan small { font-size:calc(1.9 * var(--u)); color:#9ca3af; text-shadow:none; }
  .fila { position:absolute; top:calc(40.5 * var(--u)); right:calc(3 * var(--u)); background:rgba(0,0,0,.6);
    border-radius:calc(3 * var(--u)); padding:calc(.6 * var(--u)) calc(2 * var(--u)); font-size:calc(2.6 * var(--u)); color:#ffd166; }
  .fila:empty { display:none; }

  /* parte de baixo */
  .baixo { position:absolute; left:0; right:0; bottom:0; display:flex; flex-direction:column; gap:calc(1.2 * var(--u)); }
  .caixa { margin:0 calc(3 * var(--u)); background:rgba(0,0,0,.78); border:calc(.25 * var(--u)) solid rgba(57,255,106,.5);
    border-radius:calc(2 * var(--u)); padding:calc(1.2 * var(--u)) calc(2 * var(--u)); text-align:center; }
  .caixa h3 { font:normal calc(3.6 * var(--u)) Impact, sans-serif; white-space:nowrap; color:#fff; letter-spacing:calc(.3 * var(--u)); }
  .caixa h3 span { color:#ff3b30; }
  .caixa p { font-size:calc(2.5 * var(--u)); color:var(--verde); margin-top:calc(.4 * var(--u)); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rodape { background:linear-gradient(90deg,#ffb703,#ffd166,#ffb703); color:#1a1300; text-align:center;
    font:normal calc(3.4 * var(--u)) Impact, sans-serif; padding:calc(1.3 * var(--u)) calc(2 * var(--u)); white-space:nowrap; }
  .rodape b { font-weight:normal; color:#7a0000; }
  .rodape:empty { display:none; }
</style>

<script type="importmap">{ "imports": { "three": "/three/build/three.module.js" } }</script>
<script type="module">
// Casinha 3D em linhas verdes para o "scanner". É um DESENHO gerado do @ (cada pessoa tem a sua), nunca uma casa real.
import * as THREE from 'three';
const painel = document.getElementById('scan');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.localClippingEnabled = true;
painel.prepend(renderer.domElement);
const cena = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, .1, 100);
camera.position.set(12, 8.5, 15);
camera.lookAt(0, 2.2, 0);
const VERDE = 0x39ff6a;
const corte = new THREE.Plane(new THREE.Vector3(0, -1, 0), 0); // só mostra o que já foi escaneado (abaixo do feixe)
const grade = new THREE.GridHelper(16, 16, 0x1f7a3a, 0x0f3d1d);
cena.add(grade);
const feixe = new THREE.Mesh(new THREE.PlaneGeometry(9, 9), new THREE.MeshBasicMaterial({ color: VERDE, transparent: true, opacity: .12, side: THREE.DoubleSide }));
feixe.rotation.x = -Math.PI / 2;
cena.add(feixe);
let casa = null, pessoa = null, alturaTotal = 4;

function sorteador(texto) {
  let s = 2166136261;
  for (const c of texto) s = Math.imul(s ^ c.charCodeAt(0), 16777619);
  return () => (s = Math.imul(s ^ (s >>> 15), 2246822507) >>> 0, (s % 10000) / 10000);
}
function caixa(l, a, p, x, y, z, pai) {
  const g = new THREE.BoxGeometry(l, a, p);
  const faces = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: VERDE, transparent: true, opacity: .07, clippingPlanes: [corte], depthWrite: false }));
  const linhas = new THREE.LineSegments(new THREE.EdgesGeometry(g), new THREE.LineBasicMaterial({ color: VERDE, clippingPlanes: [corte] }));
  faces.position.set(x, y, z); linhas.position.set(x, y, z);
  pai.add(faces, linhas);
}
function telhado(l, p, h, y, pai) {
  const forma = new THREE.Shape([new THREE.Vector2(-l / 2 - .3, 0), new THREE.Vector2(l / 2 + .3, 0), new THREE.Vector2(0, h)]);
  const g = new THREE.ExtrudeGeometry(forma, { depth: p + .4, bevelEnabled: false });
  g.translate(0, y, -p / 2 - .2);
  pai.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: VERDE, transparent: true, opacity: .1, clippingPlanes: [corte], depthWrite: false })),
    new THREE.LineSegments(new THREE.EdgesGeometry(g), new THREE.LineBasicMaterial({ color: VERDE, clippingPlanes: [corte] })));
}
function retangulo(l, a, x, y, z, pai, rotY = 0) {
  const pts = [[-l / 2, -a / 2], [l / 2, -a / 2], [l / 2, a / 2], [-l / 2, a / 2], [-l / 2, -a / 2]].map(([u, v]) => new THREE.Vector3(u, v, 0));
  const r = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0xb6ffc8, clippingPlanes: [corte] }));
  r.position.set(x, y, z); r.rotation.y = rotY;
  pai.add(r);
}
function brilho(cor) {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, cor); gr.addColorStop(1, 'rgba(255,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), blending: THREE.AdditiveBlending, depthWrite: false }));
}

function montar(semente) {
  if (casa) cena.remove(casa);
  const r = sorteador(semente);
  casa = new THREE.Group();
  const l = 4 + r() * 2, p = 3.5 + r() * 1.5, andares = r() < .35 ? 2 : 1, ha = 2.3;
  for (let i = 0; i < andares; i++) caixa(l, ha, p, 0, ha / 2 + i * ha, 0, casa);
  const topo = andares * ha;
  telhado(l, p, 2 + r() * .6, topo, casa);
  alturaTotal = topo + 2.7;
  retangulo(.9, 1.7, -l / 4, .85, p / 2 + .01, casa);                  // porta
  for (let i = 0; i < andares; i++) {                                     // janelas
    retangulo(1, .8, l / 4, 1.3 + i * ha, p / 2 + .01, casa);
    if (i > 0) retangulo(1, .8, -l / 4, 1.3 + i * ha, p / 2 + .01, casa);
    retangulo(1, .8, 0, 1.3 + i * ha, -p / 2 - .01, casa);
    retangulo(.9, .8, 0, 1.3 + i * ha, 0, casa, Math.PI / 2);
  }
  if (r() < .5) caixa(2.4, 2, p * .8, l / 2 + 1.25, 1, 0, casa);         // garagem
  // "sinal de calor": silhueta de pessoa dentro da casa
  pessoa = new THREE.Group();
  const vermelho = new THREE.MeshBasicMaterial({ color: 0xff3b30 });
  const cabeca = new THREE.Mesh(new THREE.SphereGeometry(.22, 16, 12), vermelho); cabeca.position.y = 1.55;
  const corpo = new THREE.Mesh(new THREE.CylinderGeometry(.25, .2, .9, 12), vermelho); corpo.position.y = .95;
  const pernas = new THREE.Mesh(new THREE.CylinderGeometry(.2, .15, .55, 12), vermelho); pernas.position.y = .28;
  const aura = brilho('rgba(255,60,40,.9)'); aura.scale.set(2.6, 2.6, 1); aura.position.y = 1;
  pessoa.add(cabeca, corpo, pernas, aura);
  pessoa.position.set((r() - .5) * (l - 1.5), andares === 2 && r() < .5 ? ha : 0, (r() - .5) * (p - 1.5));
  pessoa.visible = false;
  casa.add(pessoa);
  cena.add(casa);
}

let ativo = false, prog = 0;
window.scanner = {
  mostrar(semente) { montar(semente); prog = 0; ativo = true; ajustar(); laco(); },
  progresso(v) { prog = v; },
  revelar() { pessoa.visible = true; },
  esconder() { ativo = false; },
};
function ajustar() {
  const w = painel.clientWidth, h = painel.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', ajustar);
const relogio = new THREE.Clock();
function laco() {
  if (!ativo) return;
  if (renderer.domElement.width !== Math.round(painel.clientWidth * renderer.getPixelRatio())) ajustar();
  const t = relogio.getElapsedTime();
  casa.rotation.y = t * .5;
  const y = prog * alturaTotal;
  corte.constant = y;
  feixe.position.y = y;
  feixe.visible = prog < 1;
  if (pessoa.visible) { const s = 1 + Math.sin(t * 6) * .08; pessoa.scale.set(s, s, s); }
  renderer.render(cena, camera);
  requestAnimationFrame(laco);
}
</script>
<script src="/leaflet/leaflet.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const esperar = ms => new Promise(r => setTimeout(r, ms));

// ---------- mapa de satélite (Esri) com nomes de cidades por cima ----------
const BRASIL = [-14.5, -52], ZOOM_BRASIL = 4;
const mapa = L.map('mapa', { zoomControl: false, attributionControl: true, zoomSnap: 0.25,
  dragging: false, scrollWheelZoom: false, doubleClickZoom: false, keyboard: false }).setView(BRASIL, ZOOM_BRASIL);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { maxZoom: 18, attribution: 'Imagens © Esri' }).addTo(mapa);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
  { maxZoom: 18 }).addTo(mapa);
// o centro do mapa fica um pouco abaixo do meio (onde está a mira)
function centroComMira(lat, lon, zoom) {
  const p = mapa.project([lat, lon], zoom);
  return mapa.unproject(p.subtract([0, mapa.getSize().y * .08]), zoom);
}

// ---------- webcam: usa public/webcam.mp4 se existir; senão, o desenho ----------
const video = $('video');
video.onloadeddata = () => $('cam').classList.add('com-video');
video.src = '/webcam.mp4';
const ruido = $('ruido'), rg = ruido.getContext('2d');
setInterval(() => {
  const img = rg.createImageData(ruido.width, ruido.height);
  for (let i = 0; i < img.data.length; i += 4) { const v = Math.random() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  rg.putImageData(img, 0, 0);
  $('hora').textContent = new Date().toLocaleTimeString('pt-BR');
}, 90);

// ---------- terminal ----------
const terminal = $('terminal');
function linha(texto, classe = '') {
  const d = document.createElement('div');
  terminal.querySelectorAll('.cursor').forEach(e => e.classList.remove('cursor'));
  d.className = 't ' + classe;
  d.textContent = texto;
  terminal.appendChild(d);
  while (terminal.children.length > 11) terminal.firstElementChild.remove();
  return d;
}
async function digitar(texto, classe = '', vel = 22) {
  const d = linha('', classe + ' cursor');
  for (const ch of texto) { d.textContent += ch; if (ch !== ' ') tom(1800 + Math.random() * 400, .015, 'square', .04); await esperar(vel); }
  d.classList.remove('cursor');
  return d;
}

// ---------- som ----------
let volume = 30, audio;
function tom(freq, dur, tipo = 'sine', ganho = .25) {
  if (volume <= 0) return;
  try {
    audio = audio || new AudioContext();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = tipo; o.frequency.value = freq;
    g.gain.setValueAtTime(ganho * volume / 100, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + dur);
    o.connect(g).connect(audio.destination);
    o.start(); o.stop(audio.currentTime + dur);
  } catch {}
}

// ---------- fila: um alvo por vez ----------
let segNaTela = 6;
const fila = [];
let ocupado = false;
function novoAlvo(m) {
  if (fila.some(f => f.id === m.id)) return;
  fila.push(m);
  atualizarFila();
}
function atualizarFila() { $('fila').textContent = fila.length ? `⏳ FILA: ${fila.length}` : ''; }

async function rastrear(m) {
  const tela = document.body, c = m.cidade, quem = m.arroba ? '@' + m.arroba : m.nome;
  tela.classList.remove('achou');
  await digitar(`> novo alvo: ${quem}`, 'forte');
  await digitar('> iniciando rastreamento...');
  tela.classList.add('rastreando');
  // voo: do Brasil até a cidade sorteada
  mapa.flyTo(centroComMira(c.lat, c.lon, 13), 13, { duration: 5.5 });
  await digitar('> conectando satélite BR-04... OK');
  const barra = linha('> triangulando sinal [..........] 0%');
  for (let i = 1; i <= 10; i++) {
    barra.textContent = `> triangulando sinal [${'█'.repeat(i)}${'.'.repeat(10 - i)}] ${i * 10}%`;
    tom(500 + i * 60, .05, 'square', .06);
    await esperar(150);
  }
  await digitar(`> região: ${c.uf}`);
  await digitar(`> cidade: ${c.nome.toUpperCase()}`, 'forte');
  await esperar(600);
  await digitar('> escaneando estrutura...');
  await escanearCasa(m);
  await digitar('> ALVO LOCALIZADO ✔', 'alerta');

  $('resFoto').innerHTML = m.foto ? `<img src="${esc(m.foto)}">` : '<span class="sem"></span>';
  $('resNome').textContent = m.nome;
  $('resArroba').textContent = m.arroba ? '@' + m.arroba : '';
  $('resCidade').textContent = `📍 ${c.nome} - ${c.uf}`;
  tela.classList.add('achou');
  for (let i = 0; i < 3; i++) { tom(1400, .12, 'square', .12); await esperar(180); }

  await esperar(segNaTela * 1000);
  tela.classList.remove('achou', 'rastreando');
  linha('> sessão encerrada.');
  mapa.flyTo(BRASIL, ZOOM_BRASIL, { duration: 2.5 });
  await esperar(2600);
}

// Scanner: mostra a casinha 3D (desenho, gerado do @ da pessoa), escaneia e acha o "calor" dentro
async function escanearCasa(m) {
  const sc = window.scanner, painel = $('scan');
  if (!sc) return;
  painel.classList.remove('achou-casa');
  $('scanStatus').textContent = 'escaneando estrutura...';
  document.body.classList.add('escaneando'); // primeiro mostra o painel, para a casa ter tamanho
  sc.mostrar(m.arroba || m.nome);
  for (let i = 0; i <= 100; i += 4) {
    sc.progresso(i / 100);
    $('scanPct').textContent = i + '%';
    if (i === 48) $('scanStatus').textContent = 'procurando sinal de calor...';
    if (i % 12 === 0) tom(300 + i * 6, .06, 'sawtooth', .05);
    await esperar(110);
  }
  sc.revelar();
  painel.classList.add('achou-casa');
  $('scanStatus').textContent = '🏠 ALVO DENTRO DE CASA ✔';
  tom(700, .15, 'square', .12); setTimeout(() => tom(1050, .3, 'square', .12), 160);
  await esperar(2800);
  document.body.classList.remove('escaneando');
  sc.esconder();
}

async function rodarFila() {
  linha('> sistema pronto.');
  linha('> aguardando rosa...', 'cursor');
  while (true) {
    if (!fila.length) { await esperar(300); continue; }
    const m = fila.shift();
    atualizarFila();
    await rastrear(m);
    if (!fila.length) linha('> aguardando rosa...', 'cursor');
  }
}
rodarFila();

// ---------- informações ----------
function atualizarInfo(p) {
  segNaTela = p.segundosNaTela;
  volume = Number(new URLSearchParams(location.search).get('volume') ?? p.volume ?? 30);
  $('marca').textContent = p.marca || '';
  $('rodape').innerHTML = p.contato ? `🎮 Jogo interativo pra sua live? <b>WhatsApp ${esc(p.contato)}</b>` : '';
  $('ultimos').textContent = p.ultimos.length
    ? '> últimos: ' + p.ultimos.map(a => `${a.arroba ? '@' + a.arroba : a.nome} (${a.cidade.uf})`).join(' · ')
    : '> nenhum alvo ainda...';
}

function conectar() {
  const ws = new WebSocket(`ws://${location.host}`);
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.tipo === 'info') atualizarInfo(m);
    if (m.tipo === 'alvo') novoAlvo(m);
  };
  ws.onclose = () => setTimeout(conectar, 2000);
}
conectar();

// Teste rápido: com esta tela aberta no navegador, aperte T para simular uma rosa.
const NOMES_TESTE = ['Maria', 'João', 'Ana Clara', 'Pedro', 'Lucas', 'Júlia', 'Carlos', 'Bia'];
addEventListener('keydown', e => {
  if (e.key.toLowerCase() !== 't') return;
  const nome = NOMES_TESTE[Math.floor(Math.random() * NOMES_TESTE.length)] + ' ' + Math.floor(Math.random() * 100);
  fetch(`/teste?nome=${encodeURIComponent(nome)}&arroba=${encodeURIComponent(nome.toLowerCase().replace(/\W+/g, ''))}`);
});
