<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medidor de Aura</title>
<style>
  /* 1 unidade = 1% da largura de uma tela em pé (9:16) que cabe na janela */
  :root { --u:min(1vw, 0.5625vh); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; color:#fff;
    font-family:Impact, 'Arial Black', sans-serif; }
  .tela { position:relative; width:calc(100 * var(--u)); height:calc(177.78 * var(--u)); margin:0 auto; overflow:hidden; }
  canvas { position:absolute; inset:0; width:100% !important; height:100% !important; display:block; }

  /* nome e @ de quem está sendo avaliado */
  .placa { position:absolute; left:0; right:0; top:calc(12 * var(--u)); text-align:center; pointer-events:none;
    transition:opacity .3s; padding:0 calc(4 * var(--u)); }
  .placa .nome { font:bold calc(8 * var(--u)) Arial, sans-serif; color:#fff; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; text-shadow:0 calc(.5 * var(--u)) calc(1 * var(--u)) rgba(0,0,0,.4); }
  .placa .arroba { font:bold calc(5 * var(--u)) Arial, sans-serif; color:#ffe14d; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; text-shadow:0 calc(.3 * var(--u)) 0 #7a5a00; }
  .vazio-placa .placa { opacity:0; }

  /* nota da aura */
  .nota { position:absolute; left:0; right:0; top:calc(24 * var(--u)); text-align:center; pointer-events:none; }
  .nota .num { font-size:calc(16 * var(--u)); line-height:1; color:#ff3b30; -webkit-text-stroke:calc(.6 * var(--u)) #fff;
    paint-order:stroke fill; text-shadow:0 calc(.8 * var(--u)) 0 rgba(0,0,0,.35); }
  .nota .rotulo { font-size:calc(9 * var(--u)); line-height:1; margin-top:calc(.5 * var(--u)); letter-spacing:calc(.3 * var(--u));
    -webkit-text-stroke:calc(.5 * var(--u)) #fff; paint-order:stroke fill; visibility:hidden; }
  .nota .mais { font-size:calc(6 * var(--u)); color:#3ddc84; -webkit-text-stroke:calc(.3 * var(--u)) #fff; paint-order:stroke fill;
    height:calc(7 * var(--u)); }
  .nota.revelada .rotulo { visibility:visible; animation:bate .4s; }
  .nota.alta .rotulo, .nota.alta .num { color:#1e88ff; }
  .nota.baixa .rotulo { color:#ff3b30; }
  .nota.infinita .rotulo, .nota.infinita .num { color:#ffc400; }
  .nota .num.suspense { animation:treme .15s infinite; color:#fff; -webkit-text-stroke-color:#000; }
  @keyframes bate { 0% { transform:scale(2); opacity:0 } 100% { transform:scale(1); opacity:1 } }
  @keyframes treme { 50% { transform:translateX(calc(.6 * var(--u))) rotate(3deg); } }
  .vazio-placa .nota { display:none; }


  /* localizador (rosa): mapa do Brasil com radar e alfinete na cidade sorteada */
  .local { position:absolute; left:50%; top:calc(27 * var(--u)); transform:translateX(-50%); width:calc(70 * var(--u));
    background:rgba(8,20,35,.96); border:calc(.4 * var(--u)) solid #3ddc84; border-radius:calc(3 * var(--u));
    padding:calc(1.5 * var(--u)) calc(2 * var(--u)); text-align:center; display:none; box-shadow:0 0 calc(4 * var(--u)) rgba(61,220,132,.5); }
  .localizando .local { display:block; animation:bate .35s; }
  .localizando .nota { display:none; }
  .local h4 { font-weight:normal; font-size:calc(3.6 * var(--u)); color:#3ddc84; letter-spacing:calc(.3 * var(--u)); }
  .local svg { width:calc(46 * var(--u)); height:calc(46 * var(--u)); display:block; margin:calc(.5 * var(--u)) auto; }
  .local .pais { fill:#14532d; stroke:#3ddc84; stroke-width:.6; }
  .local .radar { transform-origin:50px 50px; animation:gira 1.2s linear infinite; }
  .local.achou .radar { display:none; }
  .local .pino { display:none; }
  .local.achou .pino { display:block; }
  .local.achou .queda { animation:cai .4s; } /* animação no grupo de dentro: o de fora guarda a posição */
  @keyframes gira { to { transform:rotate(360deg); } }
  @keyframes cai { 0% { transform:translateY(-12px); opacity:0 } 100% { transform:none; opacity:1 } }
  .local .cidade { font-size:calc(5.5 * var(--u)); color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .local.achou .cidade { color:#ffe14d; }
  .local small { display:block; font:calc(2.2 * var(--u)) Arial, sans-serif; color:#9ca3af; margin-top:calc(.4 * var(--u)); }

  /* tela de espera */
  .espera { position:absolute; left:0; right:0; top:calc(16 * var(--u)); text-align:center; display:none; }
  .vazio-placa .espera { display:block; }
  .espera b { display:block; font-size:calc(9 * var(--u)); color:#fff; -webkit-text-stroke:calc(.4 * var(--u)) #1e88ff;
    paint-order:stroke fill; animation:respira 1.6s infinite; }
  .espera span { font:bold calc(4 * var(--u)) Arial, sans-serif; color:#ffe14d; -webkit-text-stroke:calc(.2 * var(--u)) #000; paint-order:stroke fill; }
  @keyframes respira { 50% { transform:scale(1.06); } }

  .marca { position:absolute; top:calc(3 * var(--u)); left:calc(3 * var(--u)); font-size:calc(3.4 * var(--u));
    line-height:1.05; color:#ffd166; text-shadow:0 calc(.4 * var(--u)) 0 #000; }
  .marca small { display:block; font:bold calc(1.7 * var(--u)) Arial, sans-serif; color:#fff; letter-spacing:calc(.2 * var(--u)); }
  .marca:empty { display:none; }
  .fila { position:absolute; top:calc(3 * var(--u)); right:calc(3 * var(--u)); background:rgba(0,0,0,.5);
    border-radius:calc(3 * var(--u)); padding:calc(1 * var(--u)) calc(2.5 * var(--u)); font:bold calc(2.8 * var(--u)) Arial, sans-serif; }
  .fila:empty { display:none; }

  /* parte de baixo: como jogar + ranking + contato */
  .baixo { position:absolute; left:0; right:0; bottom:0; display:flex; flex-direction:column; gap:calc(1.4 * var(--u)); }
  .caixa { margin:0 calc(3 * var(--u)); background:rgba(17,20,26,.8); border-radius:calc(2.5 * var(--u));
    padding:calc(1.3 * var(--u)) calc(2.5 * var(--u)); }
  .caixa h3 { font-weight:normal; font-size:calc(3 * var(--u)); color:#ffd166; text-align:center; letter-spacing:calc(.4 * var(--u));
    margin-bottom:calc(.6 * var(--u)); }
  .linha { text-align:center; font:calc(2.6 * var(--u)) Arial, sans-serif; color:#ddd; white-space:nowrap; }
  .top { display:flex; justify-content:space-around; font:calc(2.8 * var(--u)) Arial, sans-serif; gap:calc(2 * var(--u)); }
  .top div { display:flex; align-items:center; gap:calc(1 * var(--u)); min-width:0; }
  .top img, .top .sem { width:calc(4.6 * var(--u)); height:calc(4.6 * var(--u)); border-radius:50%; object-fit:cover; background:#555; flex:none; }
  .top .nm { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:calc(15 * var(--u)); }
  .top b { color:#ffc400; }
  .top .vazio { color:#999; }
  .rodape { background:linear-gradient(90deg,#ffb703,#ffd166,#ffb703); color:#1a1300; text-align:center;
    font-size:calc(3.4 * var(--u)); padding:calc(1.3 * var(--u)) calc(2 * var(--u)); white-space:nowrap; }
  .rodape b { font-weight:normal; color:#7a0000; }
  .rodape:empty { display:none; }
</style>
<script type="importmap">{ "imports": { "three": "/three/build/three.module.js" } }</script>
</head>
<body class="vazio-placa">
<div class="tela" id="tela">
  <div class="marca" id="marca"></div>
  <div class="fila" id="fila"></div>
  <div class="espera"><b>MEDIDOR DE AURA</b><span>Mande um presente e descubra sua aura!</span></div>
  <div class="placa"><div class="nome" id="nome"></div><div class="arroba" id="arroba"></div></div>
  <div class="local" id="local">
    <h4 id="localTitulo">📍 LOCALIZANDO...</h4>
    <svg viewBox="0 0 100 100">
      <path class="pais" d="M0.0 33.0 L3.8 38.0 L8.8 41.8 L11.5 41.5 L18.8 39.0 L21.8 41.5 L24.3 45.6 L30.5 48.1 L34.5 49.1 L33.8 52.2 L39.3 55.2 L39.8 58.2 L41.2 60.0 L41.0 64.6 L40.0 69.6 L45.7 71.1 L48.5 74.7 L48.8 78.7 L50.5 82.0 L46.0 85.1 L41.0 90.4 L45.0 92.2 L51.5 99.2 L54.3 95.4 L59.2 90.4 L63.5 85.8 L63.7 79.7 L65.0 78.0 L70.0 74.7 L74.0 72.2 L80.0 71.9 L82.5 69.1 L84.5 65.3 L87.0 58.7 L87.5 51.9 L87.8 46.8 L91.8 42.3 L96.8 36.7 L98.0 32.2 L97.0 27.6 L92.0 26.1 L87.5 22.5 L81.2 21.3 L74.2 20.3 L68.8 16.5 L63.7 16.2 L61.3 14.4 L59.0 9.4 L56.8 3.3 L53.5 8.4 L48.8 8.1 L45.0 9.1 L40.0 10.1 L36.0 9.1 L35.5 0.8 L31.8 2.5 L25.0 3.8 L23.0 8.4 L18.0 10.9 L11.5 11.1 L11.5 16.5 L10.0 24.6 L3.0 26.8 Z"/>
      <g class="radar"><path d="M50 50 L50 2 A48 48 0 0 1 84 16 Z" fill="rgba(61,220,132,.35)"/></g>
      <circle id="ponto" r="1.6" fill="#ffe14d"/>
      <g class="pino" id="pino"><g class="queda"><circle r="4" fill="none" stroke="#ff3b30" stroke-width="1"><animate attributeName="r" values="2;7;2" dur="1.2s" repeatCount="indefinite"/></circle>
        <path d="M0 0 C-3 -4 -4 -6 -4 -8 A4 4 0 0 1 4 -8 C4 -6 3 -4 0 0 Z" fill="#ff3b30" stroke="#fff" stroke-width=".6"/></g></g>
    </svg>
    <div class="cidade" id="localCidade"></div>
    <small>localização sorteada · é só brincadeira</small>
  </div>
  <div class="nota" id="nota"><div class="num" id="num">?</div><div class="rotulo" id="rotulo">AURA</div><div class="mais" id="mais"></div></div>
  <div class="baixo">
    <div class="caixa">
      <h3>🎁 MANDE PRESENTE E DESCUBRA SUA AURA</h3>
      <div class="linha">🌹 Rosa = te localizo no Brasil · cada presente = <b id="porPresente">+0.3</b> de aura</div>
    </div>
    <div class="caixa">
      <h3>🔥 MAIORES AURAS DA LIVE</h3>
      <div class="top" id="top"></div>
    </div>
    <div class="rodape" id="rodape"></div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const esperar = ms => new Promise(r => setTimeout(r, ms));

// ---------- cena: céu e chão de neve, como os jogos de aura ----------
const tela = $('tela');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
tela.prepend(renderer.domElement);

const cena = new THREE.Scene();
const ceu = document.createElement('canvas');
ceu.width = 2; ceu.height = 256;
{
  const g = ceu.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#4fb6ff'); gr.addColorStop(.6, '#bfe6ff'); gr.addColorStop(1, '#eaf7ff');
  g.fillStyle = gr; g.fillRect(0, 0, 2, 256);
}
cena.background = new THREE.CanvasTexture(ceu);
cena.fog = new THREE.Fog('#dff2ff', 25, 70);
const camera = new THREE.PerspectiveCamera(40, 9 / 16, 0.1, 150);
camera.position.set(0, 4.5, 21);
camera.lookAt(0, 3.4, 0);

cena.add(new THREE.HemisphereLight('#ffffff', '#9fc6e8', 1.8));
const sol = new THREE.DirectionalLight('#ffffff', 1.5);
sol.position.set(5, 12, 9);
sol.castShadow = true;
sol.shadow.mapSize.set(1024, 1024);
Object.assign(sol.shadow.camera, { left: -15, right: 15, top: 15, bottom: -15 });
cena.add(sol);
const chao = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshLambertMaterial({ color: '#f4fbff' }));
chao.rotation.x = -Math.PI / 2;
chao.receiveShadow = true;
cena.add(chao);
// anel brilhante embaixo de quem está sendo avaliado
const anel = new THREE.Mesh(new THREE.RingGeometry(1.8, 2.3, 48),
  new THREE.MeshBasicMaterial({ color: '#1e88ff', transparent: true, opacity: .7 }));
anel.rotation.x = -Math.PI / 2;
anel.position.y = .02;
cena.add(anel);

// ---------- boneco estilo bloco; o visual sai do @ da pessoa (cada um tem o seu) ----------
const PELES = ['#f5cd30', '#f2c9a0', '#c68642', '#8d5524', '#ffdbac'];
const CORES = ['#1f2937', '#e11d48', '#2563eb', '#16a34a', '#f59e0b', '#7c3aed', '#ffffff', '#0ea5e9', '#db2777', '#111111'];
const CABELOS = ['#111111', '#5b3a1a', '#f4d03f', '#e67e22', '#ffffff', '#ff4fb4'];
function sementeDe(texto) {
  let h = 2166136261;
  for (const c of texto) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
  return h >>> 0;
}
function sorteador(semente) {
  let s = semente || 1;
  return () => (s = Math.imul(s ^ (s >>> 15), 2246822507) >>> 0, (s % 10000) / 10000);
}

function rostoTextura(pele, sorriso) {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = pele; g.fillRect(0, 0, 128, 128);
  g.fillStyle = '#111';
  g.beginPath(); g.ellipse(44, 52, 7, 12, 0, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(84, 52, 7, 12, 0, 0, Math.PI * 2); g.fill();
  g.lineWidth = 7; g.lineCap = 'round'; g.strokeStyle = '#111';
  g.beginPath();
  if (sorriso) g.arc(64, 70, 26, .2 * Math.PI, .8 * Math.PI); else { g.moveTo(46, 90); g.lineTo(82, 86); }
  g.stroke();
  return new THREE.CanvasTexture(c);
}

function criarBoneco(arroba) {
  const r = sorteador(sementeDe(arroba || 'x'));
  const escolha = lista => lista[Math.floor(r() * lista.length)];
  const pele = escolha(PELES), camisa = escolha(CORES), calca = escolha(CORES), cabelo = escolha(CABELOS);
  const mat = cor => new THREE.MeshLambertMaterial({ color: cor });
  const raiz = new THREE.Group();
  // Grupo = articulação; a caixa fica pendurada abaixo dela (dy)
  function peca(l, a, p, m, pai, x, y, z, dy) {
    const junta = new THREE.Group();
    junta.position.set(x, y, z);
    const malha = new THREE.Mesh(new THREE.BoxGeometry(l, a, p), m);
    malha.position.y = dy;
    malha.castShadow = true;
    junta.add(malha);
    pai.add(junta);
    return junta;
  }
  const corpo = new THREE.Group(); // tudo acima do quadril, para quicar/girar
  corpo.position.y = 2;
  raiz.add(corpo);
  const tronco = peca(2, 2, 1, mat(camisa), corpo, 0, 0, 0, 1);
  if (r() < .5) { // detalhe na camisa (gravata ou listra)
    const gravata = r() < .5;
    const d = new THREE.Mesh(new THREE.BoxGeometry(gravata ? .3 : 2.02, gravata ? 1.3 : .35, .05), mat(escolha(CORES)));
    d.position.set(0, 1.2, .53);
    tronco.add(d);
  }
  const cabeca = new THREE.Group();
  cabeca.position.y = 2;
  corpo.add(cabeca);
  const mp = mat(pele);
  const cab = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2),
    [mp, mp, mp, mp, new THREE.MeshLambertMaterial({ map: rostoTextura(pele, r() < .8) }), mp]);
  cab.position.y = .65;
  cab.castShadow = true;
  cabeca.add(cab);
  const tipo = Math.floor(r() * 4);
  if (tipo === 0) { // chapéu
    const aba = new THREE.Mesh(new THREE.CylinderGeometry(1.05, 1.05, .12, 24), mat('#0b0b0b'));
    aba.position.y = 1.3; cabeca.add(aba);
    const copa = new THREE.Mesh(new THREE.CylinderGeometry(.62, .7, .7, 24), mat('#0b0b0b'));
    copa.position.y = 1.68; cabeca.add(copa);
  } else if (tipo === 1) { // boné
    const b = new THREE.Mesh(new THREE.BoxGeometry(1.3, .4, 1.3), mat(escolha(CORES)));
    b.position.y = 1.4; cabeca.add(b);
    const pala = new THREE.Mesh(new THREE.BoxGeometry(1.2, .1, .7), b.material);
    pala.position.set(0, 1.25, .9); cabeca.add(pala);
  } else { // cabelo em blocos (curto ou comprido)
    const h = new THREE.Mesh(new THREE.BoxGeometry(1.35, tipo === 2 ? .5 : .9, 1.35), mat(cabelo));
    h.position.set(0, tipo === 2 ? 1.35 : 1.2, -.05); cabeca.add(h);
    if (tipo === 3) {
      const t = new THREE.Mesh(new THREE.BoxGeometry(1.36, .9, .3), mat(cabelo));
      t.position.set(0, .9, -.55); cabeca.add(t);
    }
  }
  const mangas = [mp, mp, mat(camisa), mp, mat(camisa), mat(camisa)];
  const bracoE = peca(1, 2, 1, mangas, corpo, -1.5, 1.9, 0, -.9);
  const bracoD = peca(1, 2, 1, mangas, corpo, 1.5, 1.9, 0, -.9);
  const pernaE = peca(1, 2, 1, mat(calca), raiz, -.5, 2, 0, -1);
  const pernaD = peca(1, 2, 1, mat(calca), raiz, .5, 2, 0, -1);
  return { raiz, corpo, cabeca, bracoE, bracoD, pernaE, pernaD, fase: r() * 10 };
}

// ---------- danças (recebem o boneco e o tempo em segundos) ----------
const BPM = 128, batida = t => t * BPM / 60 * Math.PI; // meia volta por batida
function zerarPose(b) {
  for (const j of [b.bracoE, b.bracoD, b.pernaE, b.pernaD, b.cabeca, b.corpo]) j.rotation.set(0, 0, 0);
  b.corpo.position.set(0, 2, 0);
  b.raiz.position.y = 0;
}
const DANCAS = {
  // Passinho do Jamal: passinho de lado, joelho subindo, braços cruzando e cabeça no ritmo
  jamal(b, t) {
    const k = batida(t), s = Math.sin(k), c = Math.cos(k);
    b.raiz.position.x = Math.sin(k / 2) * .9;
    b.raiz.position.y = Math.abs(s) * .25;
    b.corpo.rotation.y = Math.sin(k / 2) * .45;
    b.corpo.rotation.z = -Math.sin(k / 2) * .12;
    b.pernaE.rotation.set(-Math.max(0, s) * 1.1, 0, -.15 - Math.max(0, s) * .2);
    b.pernaD.rotation.set(-Math.max(0, -s) * 1.1, 0, .15 + Math.max(0, -s) * .2);
    b.bracoE.rotation.set(-s * 1.3, 0, -.35 - Math.abs(c) * .5);
    b.bracoD.rotation.set(s * 1.3, 0, .35 + Math.abs(c) * .5);
    // a cada 8 batidas: pose do Jamal (mão pra cima apontando)
    if (Math.floor(k / Math.PI) % 8 === 7) { b.bracoD.rotation.set(-2.9, 0, .2); b.bracoE.rotation.set(0, 0, -1.2); }
    b.cabeca.rotation.x = Math.sin(k * 2) * .15;
    b.cabeca.rotation.y = -b.corpo.rotation.y * .6;
  },
  giro(b, t) {
    const k = batida(t);
    b.raiz.rotation.y = t * 5;
    b.raiz.position.y = Math.abs(Math.sin(k)) * .3;
    b.bracoE.rotation.z = -1.5; b.bracoD.rotation.z = 1.5;
    b.pernaE.rotation.x = Math.sin(k) * .4; b.pernaD.rotation.x = -Math.sin(k) * .4;
  },
  pulo(b, t) {
    const s = Math.abs(Math.sin(batida(t)));
    b.raiz.position.y = s * 1.6;
    b.bracoE.rotation.z = -.3 - s * 2.6; b.bracoD.rotation.z = .3 + s * 2.6;
    b.pernaE.rotation.z = -s * .5; b.pernaD.rotation.z = s * .5;
  },
  aura(b, t) {
    b.raiz.position.y = 1.2 + Math.sin(t * 2) * .3;
    b.bracoE.rotation.z = -.6; b.bracoD.rotation.z = .6;
    b.cabeca.rotation.x = -.25;
  },
};
// pose de "aura": braços cruzados, cabeça erguida (enquanto a nota sai)
function pose(b, t) {
  b.bracoE.rotation.set(-1.5, 0, .45); b.bracoD.rotation.set(-1.3, 0, -.45);
  b.cabeca.rotation.x = -.15 + Math.sin(t * 2) * .03;
  b.corpo.position.y = 2 + Math.sin(t * 2) * .04;
}
function parado(b, t) { // respirando de leve
  const f = t + b.fase;
  b.corpo.position.y = 2 + Math.sin(f * 2) * .03;
  b.bracoE.rotation.z = -.08 - Math.sin(f * 2) * .03;
  b.bracoD.rotation.z = .08 + Math.sin(f * 2) * .03;
  b.cabeca.rotation.y = Math.sin(f * .7) * .3;
}

// ---------- multidão: quem já foi avaliado fica no fundo ----------
const MAX_MULTIDAO = 12;
const LUGARES = [[-5, -4], [5, -4], [-8, -7], [8, -7], [-2.5, -8], [2.5, -8], [-11, -10], [11, -10], [-6, -12], [6, -12], [0, -13], [-13, -14]];
const multidao = [];
function irParaMultidao(b) {
  multidao.unshift(b);
  while (multidao.length > MAX_MULTIDAO) {
    const sai = multidao.pop();
    cena.remove(sai.raiz);
    bonecos.forEach((v, k) => { if (v === sai) bonecos.delete(k); });
  }
  multidao.forEach((m, i) => {
    m.alvo = new THREE.Vector3(LUGARES[i][0], 0, LUGARES[i][1]);
    m.raiz.rotation.y = Math.atan2(-LUGARES[i][0], 20) * .6;
  });
}

// ---------- som (tudo gerado aqui, sem música com direitos autorais) ----------
let volume = 30, audio;
function tom(freq, dur, tipo = 'sine', ganho = .25) {
  if (volume <= 0) return;
  try {
    audio = audio || new AudioContext();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = tipo; o.frequency.value = freq;
    g.gain.setValueAtTime(ganho * volume / 100, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + dur);
    o.connect(g).connect(audio.destination);
    o.start(); o.stop(audio.currentTime + dur);
  } catch {}
}
let proximaBatida = 0;
function batidaDanca(agora) {
  if (agora < proximaBatida) return;
  proximaBatida = agora + 60 / BPM;
  tom(110, .14, 'sine', .7);
}

// ---------- fila de avaliação: uma pessoa por vez no palco ----------
let segPorPresente = 4, maxSeg = 60;
const fila = [];
let atual = null;
const bonecos = new Map(); // id da pessoa -> boneco (quem volta usa o mesmo boneco)

function presente(m) {
  if (atual && atual.m.id === m.id) { // já está no palco: aura sobe na hora e ganha mais dança
    const antes = atual.m.aura;
    atual.m.aura = m.aura;
    atual.m.qtd += m.qtd;
    if (atual.revelada) mostrarNota(m.aura, `+${(m.aura - antes).toFixed(1)}`);
    return;
  }
  const naFila = fila.find(f => f.id === m.id);
  if (naFila) { naFila.aura = m.aura; naFila.qtd += m.qtd; naFila.cidade = naFila.cidade || m.cidade; return; }
  fila.push({ ...m });
  atualizarFila();
}
function atualizarFila() { $('fila').textContent = fila.length ? `⏳ Na fila: ${fila.length}` : ''; }

function mostrarNota(aura, mais = '') {
  const nota = $('nota');
  $('num').textContent = aura.toFixed(1);
  nota.classList.remove('alta', 'baixa', 'infinita');
  nota.classList.add(aura >= 9.5 ? 'infinita' : aura >= 5 ? 'alta' : 'baixa');
  $('rotulo').textContent = aura >= 9.5 ? 'AURA INFINITA' : aura >= 5 ? 'AURA' : '- AURA';
  $('mais').textContent = mais;
  if (mais) setTimeout(() => { if ($('mais').textContent === mais) $('mais').textContent = ''; }, 1500);
}


// ---------- localizador da rosa (cidade sorteada pelo servidor) ----------
const projetar = (lat, lon) => [(lon + 74) / 40 * 100, (5.5 - lat) / 39.5 * 100];
const CIDADES_ROLETA = ['São Paulo - SP', 'Manaus - AM', 'Recife - PE', 'Porto Alegre - RS', 'Salvador - BA', 'Belém - PA',
  'Goiânia - GO', 'Fortaleza - CE', 'Curitiba - PR', 'Cuiabá - MT', 'Natal - RN', 'Rio de Janeiro - RJ'];
const ROLETA_POS = [[-23.5, -46.6], [-3.1, -60], [-8, -34.9], [-30, -51.2], [-13, -38.5], [-1.5, -48.5],
  [-16.7, -49.3], [-3.7, -38.5], [-25.4, -49.3], [-15.6, -56.1], [-5.8, -35.2], [-22.9, -43.2]];
async function localizar(m) {
  const painel = $('local'), ponto = $('ponto');
  $('localTitulo').textContent = `📍 LOCALIZANDO ${m.arroba ? '@' + m.arroba : m.nome}...`;
  painel.classList.remove('achou');
  document.body.classList.add('localizando');
  for (let i = 0; i < 16; i++) { // roleta de cidades com o radar girando
    const k = Math.floor(Math.random() * CIDADES_ROLETA.length), [x, y] = projetar(...ROLETA_POS[k]);
    $('localCidade').textContent = CIDADES_ROLETA[k];
    ponto.setAttribute('cx', x); ponto.setAttribute('cy', y);
    tom(600 + (i % 2) * 200, .05, 'square', .08);
    await esperar(110 + i * 8);
  }
  const c = m.cidade, [x, y] = projetar(c.lat, c.lon);
  ponto.setAttribute('cx', -10);
  $('pino').setAttribute('transform', `translate(${x} ${y})`);
  $('localCidade').textContent = `📍 ${c.nome} - ${c.uf}`;
  $('localTitulo').textContent = `${m.arroba ? '@' + m.arroba : m.nome} ENCONTRADO!`;
  painel.classList.add('achou');
  tom(1000, .12); setTimeout(() => tom(1500, .25), 130);
  await esperar(2600);
  document.body.classList.remove('localizando');
}

async function rodarFila() {
  while (true) {
    if (!fila.length) { document.body.classList.add('vazio-placa'); await esperar(300); continue; }
    const m = fila.shift();
    atualizarFila();
    document.body.classList.remove('vazio-placa');
    $('nome').textContent = m.nome;
    $('arroba').textContent = m.arroba ? '@' + m.arroba : '';

    // boneco entra no palco (se já estava na multidão, sai de lá)
    let b = bonecos.get(m.id);
    if (b) { const i = multidao.indexOf(b); if (i >= 0) multidao.splice(i, 1); }
    else { b = criarBoneco(m.arroba || m.nome); bonecos.set(m.id, b); cena.add(b.raiz); }
    b.raiz.position.set(0, 0, 0); b.raiz.rotation.y = 0; b.alvo = null;
    atual = { m, boneco: b, revelada: false, estado: 'pose', inicio: performance.now() / 1000 };

    // mandou rosa: primeiro o "localizador" mostra a cidade sorteada
    if (m.cidade) await localizar(m);

    // suspense: "?" tremendo com rufar
    const nota = $('nota'), num = $('num');
    nota.classList.remove('revelada', 'alta', 'baixa', 'infinita');
    $('mais').textContent = '';
    num.textContent = '?';
    num.classList.add('suspense');
    for (let i = 0; i < 10; i++) { tom(300 + i * 25, .08, 'square', .12); await esperar(130); }
    num.classList.remove('suspense');

    // número sobe até a aura (quem já tinha aura sobe a partir dela)
    const de = m.auraAntes ?? 0, ate = atual.m.aura;
    for (let i = 1; i <= 15; i++) { num.textContent = (de + (ate - de) * i / 15).toFixed(1); await esperar(45); }
    mostrarNota(atual.m.aura, m.auraAntes != null ? `+${(ate - de).toFixed(1)}` : '');
    nota.classList.add('revelada');
    atual.revelada = true;
    if (atual.m.aura >= 5) { tom(880, .15); setTimeout(() => tom(1320, .3), 150); } else tom(220, .4, 'sawtooth', .15);
    await esperar(1500);

    // dança: tempo pelos presentes (com gente na fila a vez fica curta, para todo mundo jogar)
    atual.estado = 'danca';
    atual.inicio = performance.now() / 1000;
    const tempo = () => Math.min(segPorPresente * Math.max(1, atual.m.qtd), maxSeg, fila.length ? 6 : maxSeg);
    while (performance.now() / 1000 - atual.inicio < tempo()) await esperar(100);

    irParaMultidao(b);
    atual = null;
    nota.classList.remove('revelada');
  }
}
rodarFila();

// ---------- informações (marca, ranking) ----------
function atualizarInfo(p) {
  segPorPresente = p.segundosPorPresente; maxSeg = p.maxSegundos;
  volume = Number(new URLSearchParams(location.search).get('volume') ?? p.volume ?? 30);
  $('porPresente').textContent = '+' + (p.auraPorPresente ?? .3);
  $('marca').innerHTML = p.marca ? `${esc(p.marca)}<small>JOGOS INTERATIVOS</small>` : '';
  $('rodape').innerHTML = p.contato ? `🎮 Jogo interativo pra sua live? <b>WhatsApp ${esc(p.contato)}</b>` : '';
  const medalhas = ['🥇', '🥈', '🥉'];
  $('top').innerHTML = p.top.length
    ? p.top.map((e, i) => `<div>${medalhas[i]}${e.foto ? `<img src="${esc(e.foto)}">` : '<span class="sem"></span>'}`
        + `<span class="nm">${esc(e.nome)}</span><b>${Number(e.aura).toFixed(1)}</b></div>`).join('')
    : '<span class="vazio">Ninguém mediu a aura ainda!</span>';
}

// ---------- loop ----------
function ajustarTamanho() {
  const w = tela.clientWidth, h = tela.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', ajustarTamanho);
ajustarTamanho();

const relogio = new THREE.Clock();
function quadro() {
  const dt = Math.min(relogio.getDelta(), .05), agora = performance.now() / 1000;
  for (const m of multidao) {
    zerarPose(m);
    if (m.alvo) { m.raiz.position.x += (m.alvo.x - m.raiz.position.x) * Math.min(1, dt * 2.5);
                  m.raiz.position.z += (m.alvo.z - m.raiz.position.z) * Math.min(1, dt * 2.5); }
    parado(m, agora);
  }
  anel.visible = !!atual;
  if (atual) {
    const b = atual.boneco;
    zerarPose(b);
    b.raiz.position.x = 0;
    if (atual.estado === 'danca') {
      (DANCAS[atual.m.danca] || DANCAS.jamal)(b, agora - atual.inicio);
      batidaDanca(agora);
      anel.material.color.setHSL((agora * .3) % 1, 1, .55);
    } else {
      pose(b, agora);
      anel.material.color.set(atual.revelada ? (atual.m.aura >= 5 ? '#1e88ff' : '#ff3b30') : '#ffffff');
    }
    anel.scale.setScalar(1 + Math.sin(agora * 4) * .05);
  }
  renderer.render(cena, camera);
  requestAnimationFrame(quadro);
}
quadro();

function conectar() {
  const ws = new WebSocket(`ws://${location.host}`);
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.tipo === 'info') atualizarInfo(m);
    if (m.tipo === 'presente') presente(m);
  };
  ws.onclose = () => setTimeout(conectar, 2000);
}
conectar();
</script>
